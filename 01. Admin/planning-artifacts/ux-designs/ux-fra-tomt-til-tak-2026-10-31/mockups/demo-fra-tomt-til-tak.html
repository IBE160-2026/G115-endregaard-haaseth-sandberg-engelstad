<style>

body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

.top{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}

p{margin:0 0 8px;max-width:68ch}

<div class="app">
  <div class="top" id="top"></div>
  <div class="grid">
    <nav aria-label="Steg"><ul class="steps" id="steps"></ul></nav>
    <main class="main" id="main"></main>
    <aside class="side">
      <div class="card"><canvas id="c3d" width="620" height="340" role="img" aria-label="3D-visning"></canvas><div class="hint" id="alt3d"></div></div>
      <div class="card adv" aria-label="Rådgiver">
        <div class="who"><i aria-hidden="true">R</i><div><b>Rådgiver</b><span>KI-coachen din. Alltid her.</span></div></div>

<script id="engine">
const T_WEEK=67,T_COST=171,PART=['Prosjektering og byggesøknad','Grunnarbeid','Råbygg','Tett bygg','Tekniske anlegg og innredning','Overlevering'];
const SYS={cast:{n:'Plasstøpt betong',f:.96,w:2,r:'E9'},pre:{n:'Prefab betong',f:1,w:1.5,r:'E3'},steel:{n:'Stål og hulldekker',f:1.02,w:1.2,r:'E3'},clt:{n:'Massivtre',f:1.05,w:1,r:'E10'}};
const RISK={
E4:{n:'Arkeologiske funn',p:()=>.3,part:1,d:8,c:1,alt:'Ekstra arkeologer',half:1,x:1},
E5:{n:'Forurenset grunn',p:()=>.4,part:1,d:4,c:2,alt:'Sortering på stedet og ekstra graver',half:1,x:.5},
E2:{n:'Vind stopper kranløft, HMS reagerer',p:f=>.05*f,part:2,d:1,c:.2,alt:'Mobilkran og ny løfteplan',half:0,x:.4},
E9:{n:'Frost og vinterstøp',p:()=>.4,part:2,d:2,c:.8,alt:'Varme og tildekking',half:1,x:.3},
E3:{n:'Streik hos utenlandsk leverandør',p:()=>.25,part:2,d:4,c:0,alt:'Dyrere lokal leverandør',half:1,x:1.2},
E10:{n:'Fukt i massivtre',p:()=>.4,part:2,d:3,c:.5,alt:'Værtelt',half:1,x:.6}};
const OH=.3,RESP=['accept','reduce','transfer','avoid'],RN={accept:'Akseptere',reduce:'Redusere',transfer:'Overføre',avoid:'Unngå'};
const r3=x=>Math.round(x*1000)/1000;
const plotArea=f=>Math.round(2300/(f*.6)),plotCost=f=>r3(plotArea(f)*.14);
const allowed=f=>f*4<=28;
function buildCost(f,s){const lifts=f<=4?1:2,fire=f<5?0:({steel:3.3,clt:2.5}[s]||1.5);return r3(66.7*SYS[s].f+lifts*.3*f+fire)}
const refDur=(f,s)=>[12,13,Math.round(f*SYS[s].w+1e-9),10,10,5];
const risksFor=(f,s)=>['E4','E5','E2','E9','E3','E10'].filter(k=>k==='E4'||k==='E5'||k==='E2'||k===SYS[s].r);
function out(k,resp,f){const R=RISK[k],I=R.c+OH*R.d,p=R.p(f);
 if(resp==='reduce')return{up:.2*I,d:Math.floor(R.d/2),c:R.c/2,p};
 if(resp==='transfer')return{up:1.25*p*R.c,d:R.d,c:0,p};
 if(resp==='avoid')return{up:.5*I,d:0,c:0,p,gone:1};
 return{up:0,d:R.d,c:R.c,p}}
const expTot=o=>o.up+(o.gone?0:o.p*(o.c+OH*o.d));
const offered=k=>RESP.filter(r=>r!=='transfer'||RISK[k].c>0);
function suggestResp(k,f){let b=null;for(const r of offered(k)){const o=out(k,r,f),t=expTot(o),dl=o.gone?0:o.p*o.d;
 if(!b||t<b.t-1e-9||(Math.abs(t-b.t)<1e-9&&dl<b.dl-1e-9))b={r,t,dl}}return b.r}
const respOf=(P,k)=>(P.resp&&P.resp[k])||suggestResp(k,P.floors);
function exposure(P){let cost=0,wk=0,ex=0;for(const k of risksFor(P.floors,P.sys)){const o=out(k,respOf(P,k),P.floors);if(o.gone)continue;cost+=o.p*(o.c+OH*o.d);wk+=o.p*o.d;ex+=o.p*o.c}return{cost,wk,ex}}
function suggestReserve(P){const c=refDur(P.floors,P.sys).slice(1).reduce((a,b)=>a+b,0),e=exposure(P),w=Math.round(.1*c+e.wk+1e-9);return{w,c:r3(OH*w+e.ex)}}
const upfront=P=>risksFor(P.floors,P.sys).reduce((a,k)=>a+out(k,respOf(P,k),P.floors).up,0);
function planFig(P){const cw=P.est.slice(1).reduce((a,b)=>a+b,0),base=plotCost(P.floors)+buildCost(P.floors,P.sys)+OH*cw,excl=base+upfront(P);
 return{base:r3(base),excl:r3(excl),cost:r3(excl+P.resC),week:P.est.reduce((a,b)=>a+b,0)+P.resW}}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function draw(P,seed){const u=rng(seed),L=[-.1,0,.1,.2,.3],dev=[0,0,0,0,0].map(()=>L[Math.floor(u()*5)]);
 const ks=risksFor(P.floors,P.sys),us={};ks.forEach(k=>us[k]=u());const aiU=[u(),u(),u(),u(),u()];
 const ref=refDur(P.floors,P.sys),actual=ref.map((d,i)=>i?Math.round(d*(1+dev[i-1])+1e-9):d);
 const live=ks.filter(k=>respOf(P,k)!=='avoid'),hit=live.filter(k=>us[k]<RISK[k].p(P.floors)).sort((a,b)=>us[a]-us[b]).slice(0,2);
 const byRatio=live.filter(k=>!hit.includes(k)).sort((a,b)=>us[a]/RISK[a].p(P.floors)-us[b]/RISK[b].p(P.floors));
 if(!hit.length&&byRatio.length)hit.push(byRatio.shift());
 const ev=[];let best=-1,gap=0;for(let i=1;i<6;i++){const g=actual[i]-P.est[i];if(g>gap){gap=g;best=i}}
 if(best>0)ev.push({id:'E1',type:'over',part:best,gap});else if(byRatio.length)hit.push(byRatio.shift());
 hit.forEach(k=>ev.push({id:k,type:'risk',part:RISK[k].part}));ev.push({id:'E8',type:'change',part:4});
 const ord={over:0,risk:1,change:2};ev.sort((a,b)=>a.part-b.part||ord[a.type]-ord[b.type]);
 return{dev,ev,aiU,actual}}
function sim(P,D,events,dec){const ref=refDur(P.floors,P.sys),work=ref.map((d,i)=>i?Math.round(d*(1+D.dev[i-1])+1e-9):d),idle=[0,0,0,0,0,0],mode=[];let extra=0;
 const ot=i=>{if(mode[i])return;mode[i]=1;const d=Math.round(work[i]*6/7+1e-9);extra+=.039*d;work[i]=d};
 const hire=i=>{if(mode[i])return;mode[i]=1;const d=Math.round(work[i]*.8+1e-9);extra+=.14625*d;work[i]=d};
 const ks=risksFor(P.floors,P.sys);
 for(const e of events){const c=dec[e.id];
  if(e.type==='over'){if(c==='ot')ot(e.part);if(c==='hire')hire(e.part)}
  else if(e.type==='risk'){if(!ks.includes(e.id)||respOf(P,e.id)==='avoid')continue;const o=out(e.id,respOf(P,e.id),P.floors),R=RISK[e.id];
   if(c==='alt'){idle[e.part]+=R.half?Math.floor(o.d/2):0;extra+=o.c+R.x}else{idle[e.part]+=o.d;extra+=o.c;if(c==='ot')ot(e.part)}}
  else{if(c==='later')extra+=3;else{extra+=2;idle[4]+=2}}}
 const dur=work.map((w,i)=>w+idle[i]),week=dur.reduce((a,b)=>a+b,0),cw=week-dur[0];
 return{dur,week,cost:r3(plotCost(P.floors)+buildCost(P.floors,P.sys)+OH*cw+upfront(P)+extra)}}
function optionsFor(e,dec,evs,D,P){if(e.type==='change')return['now','later'];
 const prior=evs.slice(0,evs.indexOf(e));const used=prior.some(x=>x.part===e.part&&['ot','hire'].includes(dec[x.id]));
 if(e.type==='over')return used?['accept']:['accept','ot','hire'];return used?['take','alt']:['take','alt','ot']}
function aiPick(e,dec,evs,D,P,rel,uv){const i=evs.indexOf(e),ids=optionsFor(e,dec,evs,D,P).map(o=>({o,r:sim(P,D,evs.slice(0,i+1),{...dec,[e.id]:o})}));
 ids.sort((a,b)=>a.r.cost-b.r.cost||a.r.week-b.r.week);return(uv<rel||ids.length<2)?ids[0].o:ids[1].o}
function aiPath(P,D,rel){const dec={};D.ev.forEach((e,i)=>dec[e.id]=aiPick(e,dec,D.ev,D,P,rel,D.aiU[i]));return dec}
function band(c,w){const bc=c<=T_COST?0:c<=T_COST*1.05?1:2,bw=w<=T_WEEK?0:w<=Math.ceil(T_WEEK*1.05)?1:2;return[bc,bw]}
</script>

<script>
const fmt=(x,d=1)=>x.toFixed(d).replace('.',','),mn=x=>fmt(x,1)+' MNOK',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REL={lett:1,middels:.8,vanskelig:.6},STEPS=[['intro','Oppdrag'],['concept','Konsept'],['schedule','Tidsplan'],['risk','Risiko og reserve'],['present','Legg frem']];
let S;
function fresh(seed,diff){const est=[12,9,5,7,7,3];S={scr:'intro',diff:diff||'middels',seed:seed||20261105,floors:5,sys:'pre',est,resp:{},resW:0,resC:0,touched:false,D:null,dec:{},idx:0,last:null,log:[],recs:[],chat:[]}}
const plan=()=>({floors:S.floors,sys:S.sys,est:S.est,resp:S.resp,resW:S.resW,resC:S.resC});
const logit=(what,rec,warn)=>S.log.push({tid:new Date().toLocaleTimeString('nb-NO'),valg:what,raadgiver:rec||'',advarsel:warn||''});
const idx=()=>['intro','concept','schedule','risk','present','exec','debrief'].indexOf(S.scr);
const OPT={accept:'Godta forsinkelsen',ot:'Kjør overtid',hire:'Leie inn folk',take:'Ta konsekvensen',alt:'',now:'Godkjenn nå',later:'Godkjenn senere'};
const optName=(e,o)=>o==='alt'?RISK[e.id].alt:OPT[o];
function citeFor(){return{steel:'Statens hus Nordfjordeid (1 880 m², stål og hulldekker) tok ca. 11 måneder å bygge.',pre:'Elvebredden på Kongsvinger (stål og prefab) brukte ca. 3 uker per etasje på 1 400 m².',clt:'Valle Wood i Oslo (massivtre, 6 700 m²) ble noen måneder forsinket fordi kranen måtte holde bjelkene til de var boltet.',cast:'Vi har ikke et publisert norsk kontorbygg i plasstøpt betong i denne størrelsen, men tallene bygger på normal råbyggtid per etasje.'}[S.sys]}
function badParts(){const r=refDur(S.floors,S.sys);return S.est.map((e,i)=>Math.abs(e-r[i])>.2*r[i]?i:-1).filter(i=>i>=0)}
function advice(){const P=plan(),r=refDur(S.floors,S.sys);
 if(S.scr==='intro')return{t:'Hei! Jeg hjelper deg med planen. Du bestemmer. Jeg sier fra hvis noe ser urealistisk ut, og forteller hva lignende prosjekter har gjort.'};
 if(S.scr==='concept'){if(!allowed(S.floors))return{k:'bad',t:`${S.floors} etasjer gir et bygg på ${S.floors*4} meter. Reguleringen tillater maks 28 meter, så dette kan ikke godkjennes.`};
  const cur=planCostRef(S.floors,S.sys),o=Object.keys(SYS).filter(s=>s!==S.sys).map(s=>({s,d:Math.abs(planCostRef(S.floors,s)-cur)})).sort((a,b)=>a.d-b.d)[0];
  return{t:`Hver etasje sparer tomt, men gir lengre råbygg. ${SYS[S.sys].n} og ${SYS[o.s].n.toLowerCase()} skiller seg bare med ca. ${fmt(o.d)} MNOK. Velg ut fra tid og risiko. Etasjevalget betyr mye mer.`}}
 if(S.scr==='schedule'){const b=badParts();if(b.length){const i=b.sort((x,y)=>(S.est[y]-r[y]===0?0:Math.abs(S.est[y]-r[y])/r[y])-Math.abs(S.est[x]-r[x])/r[x])[0];
   return{k:'warn',t:`${PART[i]}: du har satt ${S.est[i]} uker. Sammenlignbare prosjekter tilsier ca. ${r[i]} uker. ${i===2?citeFor():'Bygg sprekker i snitt 32 % på tid fordi anslagene er for optimistiske.'}`}}
  return{t:'Anslagene dine ligger nær det sammenlignbare prosjekter brukte. Bra!'}}
 if(S.scr==='risk'){if(S.resW===0&&S.resC===0)return{k:'warn',t:'Du har ingen reserve. Uten reserve treffer hver hendelse sluttresultatet direkte.'};
  const over=risksFor(S.floors,S.sys).filter(k=>expTot(out(k,respOf(P,k),S.floors))>expTot(out(k,suggestResp(k,S.floors),S.floors))+.05);
  if(over.length)return{k:'warn',t:`${RISK[over[0]].n}: valget ditt har høyere forventet kostnad enn ${RN[suggestResp(over[0],S.floors)].toLowerCase()}. Det kan likevel være riktig hvis du ikke tåler usikkerheten.`};return{t:'Tiltakene dine har lav forventet kostnad.'}}
 if(S.scr==='present'){const f=planFig(P),b=band(f.cost,f.week);return{k:b[0]||b[1]?'warn':'',t:b[0]||b[1]?'Planen går over målene. Du kan godkjenne den likevel, men da har du lite å gå på når noe skjer.':'Planen er innenfor målene. La oss se om den tåler virkeligheten.'}}
 return{t:'Jeg gir en anbefaling ved hver hendelse. Du bestemmer.'}}
function planCostRef(f,s){const P={floors:f,sys:s,est:refDur(f,s),resp:{},resW:0,resC:0};return planFig(P).excl}
const QA={concept:[['Hva betyr etasjevalget?','Tomten koster 140 000 kr per m². Færre etasjer gir større grunnflate og dyrere tomt. Fra 3 til 7 etasjer sparer du ca. 100 MNOK, men hver etasje gir lengre råbygg.'],['Hva er bæresystem?','Bæresystemet er det som holder bygget oppe. Massivtre og stål går raskt, plasstøpt betong tar lengst tid men er billigst.'],['Hvorfor brannklasse fra 5 etasjer?','Byggeforskriften TEK17 krever strengere brannsikring fra 5 etasjer. Det gir en ekstra kostnad i modellen. Beløpet er et estimat.']],

 const lo=Math.floor(Math.min(...vals.filter(v=>!v.t).flatMap(v=>[v.a,v.b]),T_COST,fin)-4),hi=Math.ceil(Math.max(...vals.filter(v=>!v.t).flatMap(v=>[v.a,v.b]),T_COST,fin)+4),x=v=>190+(v-lo)/(hi-lo)*(W-270);
 const s=vals.map((v,i)=>{const y=i*rowH+4,a=v.t?lo:Math.min(v.a,v.b),b=v.t?v.b:Math.max(v.a,v.b),col=v.t?'var(--acc)':v.d>0?'var(--bad)':'var(--ok)';return`<text x="0" y="${y+15}">${v.l}</text><rect x="${x(a)}" y="${y+2}" width="${Math.max(2,x(b)-x(a))}" height="18" rx="2" fill="${col}"/><text x="${x(b)+6}" y="${y+15}">${v.t?fmt(v.b)+' MNOK':(v.d>=0?'+':'−')+fmt(Math.abs(v.d))}</text>`}).join('');
 return`<div class="tw"><svg viewBox="0 0 ${W} ${vals.length*rowH+8}" style="width:100%;min-width:460px" role="img" aria-label="Budsjettbro fra mål til sluttkostnad">${s}</svg></div><p class="hint">Stolpene for mål og sluttkostnad starter på ${lo} MNOK, ikke null.</p>`}
function draw3D(){const c=document.getElementById('c3d'),g=c.getContext('2d'),W=c.width,H=c.height;g.clearRect(0,0,W,H);const f=allowed(S.floors)?S.floors:S.floors,sq=Math.sqrt(plotArea(Math.min(f,8))),fs=Math.sqrt(2300/f),k=3.0,iso=(x,y,z)=>[W/2+(x-y)*k*.87,H-70+(x+y)*k*.42-65-z];
 const poly=(p,fill,st)=>{g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fillStyle=fill;g.fill();if(st){g.strokeStyle=st;g.stroke()}};
 const s2=sq/2;poly([iso(-s2,-s2,0),iso(s2,-s2,0),iso(s2,s2,0),iso(-s2,s2,0)],'#dfe8d8','#b9c8ad');
 let built=f,pct=null,pit=false;if(S.scr==='exec'||S.scr==='debrief'){const P=plan(),e=S.scr==='exec'&&S.D.ev[S.idx];const n=S.scr==='exec'?S.idx+(S.last?1:0):S.D.ev.length,r=sim(P,S.D,S.D.ev.slice(0,n),S.dec);const wk=S.scr==='debrief'?r.week:(e?evWeek(e):r.week);const st=i=>r.dur.slice(0,i).reduce((a,b)=>a+b,0);pct=wk;built=wk<=st(2)?0:Math.min(f,Math.round((wk-st(2))/Math.max(1,r.dur[2])*f));pit=wk<st(2)+1&&wk>=st(1)}
 const col={cast:['#c9ced4','#aab1b9','#e2e6ea'],pre:['#c9d6e3','#9fb2c6','#e6edf4'],steel:['#b7cde4','#8fadc9','#dbe8f3'],clt:['#e0c49a','#c9a673','#efdcc0']}[S.sys],h=9*4/ (f>7?1.15:1),b=fs/2;
 if(pit)poly([iso(-b,-b,0),iso(b,-b,0),iso(b,b,0),iso(-b,b,0)],'#a58f73','#7c6a54');
 for(let i=0;i<built;i++){const dz=h;const z0=i*dz*.62,z1=(i+1)*dz*.62;const over=i*4>=28;
  poly([iso(b,-b,z0),iso(b,b,z0),iso(b,b,z1),iso(b,-b,z1)],over?'#f2b8b0':col[0],'#7f8c99');poly([iso(-b,b,z0),iso(b,b,z0),iso(b,b,z1),iso(-b,b,z1)],over?'#e59a90':col[1],'#7f8c99');
  if(i===built-1)poly([iso(-b,-b,z1),iso(b,-b,z1),iso(b,b,z1),iso(-b,b,z1)],col[2],'#7f8c99')}
 g.fillStyle='#1b1b1b';g.font='24px "Segoe UI",system-ui,sans-serif';g.fillText(pct===null?`${f} etasjer · ${f*4} m · tomt ${plotArea(f)} m²`:`Uke ${pct} · ${built} av ${f} etasjer`,16,32);
 document.getElementById('alt3d').textContent=pct===null?`Bygg i ${f} etasjer på ${Math.round(2300/f)} m² grunnflate, ${SYS[S.sys].n.toLowerCase()}.`:`Uke ${pct}: ${built} av ${f} etasjer er reist.`;c.setAttribute('aria-label',document.getElementById('alt3d').textContent)}
let lastAdv='';
function render(){const foc=document.activeElement&&document.activeElement.id;document.getElementById('top').innerHTML=kpis();document.getElementById('steps').innerHTML=steps();
 document.getElementById('main').innerHTML=({intro:vIntro,concept:vConcept,schedule:vSched,risk:vRisk,present:vPresent,exec:vExec,debrief:vDebrief})[S.scr]();
 const a=advice();if(a.t!==lastAdv&&S.scr!=='exec'&&S.scr!=='debrief'){say(a.t,'r',a.k);lastAdv=a.t}
 const ch=document.getElementById('chat');ch.innerHTML=S.chat.map(m=>`<div class="msg ${m.who==='me'?'me':''} ${m.k||''}">${esc(m.text)}${m.pre?'<small>Forberedt svar</small>':''}</div>`).join('');ch.scrollTop=ch.scrollHeight;
 document.getElementById('chips').innerHTML=(QA[S.scr]||QA.all).map((q,i)=>`<button type="button" id="ch${i}" data-q="${i}">${q[0]}</button>`).join('');draw3D();
 if(foc&&document.getElementById(foc)&&foc!=='q')document.getElementById(foc).focus()}
function approve(){const P=plan(),f=planFig(P);logit(`Godkjente plan: ${S.floors} etasjer, ${SYS[S.sys].n}, ${mn(f.cost)}, uke ${f.week}`,'',band(f.cost,f.week).some(x=>x)?'Planen over målene':'');S.D=draw(P,S.seed);S.scr='exec';S.idx=0;S.dec={};S.last=null;S.touched=false;say('Da bygger vi. Jeg anbefaler ved hver hendelse, og du bestemmer.','r')}
function pick(o){const P=plan(),e=curEv(),i=S.idx,rel=REL[S.diff],rec=aiPick(e,S.dec,S.D.ev,S.D,P,rel,S.D.aiU[i]),evs=S.D.ev.slice(0,i+1),you=sim(P,S.D,evs,{...S.dec,[e.id]:o}),ai=sim(P,S.D,evs,{...S.dec,[e.id]:rec});
 S.dec[e.id]=o;S.recs.push({f:o===rec,yc:you.cost,rc:ai.cost});logit(`${evText(e)[0]}: ${optName(e,o)}`,optName(e,rec));S.last={you,ai,yn:optName(e,o),an:optName(e,rec)};say(`Jeg anbefalte «${optName(e,rec).toLowerCase()}». ${o===rec?'Vi var enige.':'Du valgte annerledes, og det er lov.'}`,'r')}
document.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t||t.closest('form'))return;const d=t.dataset;
 if(d.go){S.touched=S.touched||d.go!=='intro';S.scr=d.go}
 else if(d.set){if(d.set==='diff')S.diff=d.v;else if(d.set==='floors')S.floors=+d.v;else if(d.set==='sys')S.sys=d.v;else S.resp={...S.resp,[d.set.slice(2)]:d.v}}
 else if(d.est){S.est=S.est.slice();S.est[+d.est]=Math.max(1,S.est[+d.est]+ +d.d)}
 else if(d.res==='w')S.resW=Math.max(0,S.resW+ +d.d);else if(d.res==='c')S.resC=Math.max(0,S.resC+ +d.d);
 else if(d.pick)pick(d.pick);else if(d.q){const q=(QA[S.scr]||QA.all)[+d.q];say(q[0],'me');S.chat.push({text:q[1],who:'r',pre:1})}
 else if(d.act==='usedur')S.est=refDur(S.floors,S.sys);else if(d.act==='useres'){const s=suggestReserve(plan());S.resW=s.w;S.resC=s.c}
 else if(d.act==='approve')approve();else if(d.act==='cont'){S.last=null;S.idx++;if(S.idx>=S.D.ev.length)S.scr='debrief'}
 else if(d.act==='again'){const k=S.diff;fresh((Math.random()*1e9)|0,k);lastAdv=''}
 else if(d.act==='copy'){const a=document.getElementById('logt');a.hidden=false;a.select();navigator.clipboard?.writeText(a.value).then(()=>{t.textContent='Kopiert'}).catch(()=>{t.textContent='Marker teksten og kopier'});return}
 else return;render()});
document.getElementById('ask').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('q'),v=i.value.trim();if(!v)return;say(v,'me');S.chat.push({text:answer(v),who:'r',pre:1});i.value='';render()});
fresh();render();
